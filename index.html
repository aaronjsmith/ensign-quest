<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ensign.quest</title>
    <meta
      name="description"
      content="Course and project sites hosted under ensign.quest."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <main class="shell">
      <header class="brand">
        <h1 class="brand__logo">
          <img
            src="assets/ensign-quest-logo.png"
            alt="Ensign.quest"
            width="720"
            height="180"
          />
        </h1>
        <p class="brand__lead">Projects</p>
        <p class="brand__copy">
          A short index of course sites and tools under this domain.
        </p>
      </header>

      <section class="projects" aria-label="Project list">
        <ul class="project-list" id="project-list"></ul>
      </section>

      <footer class="site-footer">
        <p class="author">
          By
          <a href="https://aaronjsmith.me" rel="author me">aaronjsmith.me</a>
        </p>
        <p class="disclaimer">
          Created by a student of Ensign College. Not affiliated with or
          authorized by Ensign College.
        </p>
      </footer>
    </main>

    <script src="projects.js"></script>
    <script src="app.js"></script>
  </body>
</html>
