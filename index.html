<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ensign.quest</title>
    <meta
      name="description"
      content="Tools for Ensign College classes and other LDS-centric resources."
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/assets/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="topbar">
      <a class="site-logo" href="/">
        <img
          src="assets/ensign-quest-logo.svg"
          alt="Ensign.quest"
          width="929"
          height="275"
        />
      </a>
    </header>

    <div class="layout">
      <aside class="sidebar" aria-label="Contents">
        <p class="sidebar__heading">Contents</p>
        <nav class="toc" id="toc"></nav>
      </aside>

      <main class="shell">
        <header class="intro">
          <h1 class="intro__title">Projects</h1>
          <p class="intro__copy">
            Various tools for Ensign College classes and other LDS-centric tools.
          </p>
          <label class="search">
            <span class="visually-hidden">Search projects</span>
            <input
              id="kb-search"
              type="search"
              placeholder="Search…"
              autocomplete="off"
            />
          </label>
        </header>

        <div class="kb" id="kb"></div>

        <p class="kb-empty" id="kb-empty" hidden>No matching projects.</p>

        <footer class="site-footer">
          <p class="author">
            By
            <a href="https://aaronjsmith.me" rel="author me">aaronjsmith.me</a>
          </p>
          <p class="disclaimer">
            Created by a student of Ensign College. Not affiliated with or
            authorized by Ensign College.
          </p>
        </footer>
      </main>
    </div>

    <script src="projects.js"></script>
    <script src="app.js"></script>
  </body>
</html>
