<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ensign.quest</title>
    <meta
      name="description"
      content="Course and project sites hosted under ensign.quest."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <main class="shell">
      <header class="brand">
        <p class="brand__mark">ensign.quest</p>
        <h1 class="brand__lead">Projects</h1>
        <p class="brand__copy">
          A short index of course sites and tools under this domain.
        </p>
      </header>

      <section class="projects" aria-label="Project list">
        <ul class="project-list" id="project-list"></ul>
      </section>
    </main>

    <script src="projects.js"></script>
    <script src="app.js"></script>
  </body>
</html>
